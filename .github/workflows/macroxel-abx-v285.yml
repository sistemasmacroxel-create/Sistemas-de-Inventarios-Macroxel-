name: Macroxel ABX v285 capacidad confirmada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macroxel-abx-v285.yml'
      - 'tools/v285_abx_publisher.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conciliar capacidad antibioticos con inventario
        run: python3 tools/v285_abx_publisher.py
      - name: Verificar JavaScript
        run: |
          node --check docs/sistema-inventario.js
          grep -q 'mxAbxCapacityHandShakeV285' docs/sistema-inventario.js
      - name: Publicar web v285
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html docs/sistema-inventario.js; then
            echo 'Ya estaba actualizado'; exit 0
          fi
          git config user.name 'Sistemas Macroxel'
          git config user.email 'sistemasmacroxel@gmail.com'
          git add docs/index.html docs/sistema-inventario.js
          git commit -m 'Confirma capacidad de antibioticos y revision inventario v285'
          git push origin HEAD:main
