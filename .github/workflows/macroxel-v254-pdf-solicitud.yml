name: Macroxel web PDF solicitud dinamica v254

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macroxel-v254-pdf-solicitud.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web-v254:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar y validar parche v254
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          path = Path('tools/v254_pdf_patch_00.txt')
          encoded = path.read_text().strip()
          for pos in range(-1, len(encoded)):
              candidate = encoded if pos < 0 else encoded[:pos] + encoded[pos+1:]
              try:
                  decoded = gzip.decompress(base64.b64decode(candidate, validate=True))
                  if not decoded.startswith(b'#!/usr/bin/env python3'):
                      continue
                  compile(decoded, '/tmp/macroxel_v254_pdf_web.py', 'exec')
                  Path('/tmp/macroxel_v254_pdf_web.py').write_bytes(decoded)
                  path.write_text(candidate + chr(10))
                  print('Parche PDF v254 recuperado, validado y normalizado.')
                  break
              except Exception:
                  continue
          else:
              raise SystemExit('Parche v254 corrupto, no se modifica la web.')
          PY

      - name: Adaptar etiquetas opcionales a la versión web de GitHub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/macroxel_v254_pdf_web.py')
          s = p.read_text()
          needle = '    if count!=1:\n'
          replacement = "    if count==0 and old.startswith((\"pair(2,\", \"pair(5,\", \"doc.setFontSize(8.6);\")):\n        print('Etiqueta opcional no presente en esta rama:', old[:55]); return\n" + needle
          if s.count(needle) != 1:
              raise SystemExit('Validación de compatibilidad v254 no coincide')
          s = s.replace(needle, replacement)
          index_html = Path('docs/index.html').read_text(encoding='utf-8')
          target = 'sistema-inventario.js?v=' if 'sistema-inventario.js?v=' in index_html else 'sistema-inventario.js'
          start_pos = index_html.find(target)
          if start_pos < 0:
              raise SystemExit('No hay referencia al JS en index.html')
          end_pos = index_html.find(chr(34), start_pos)
          if end_pos < 0:
              raise SystemExit('Referencia al JS sin cierre')
          old_version = index_html[start_pos:end_pos]
          s = s.replace("old='sistema-inventario.js?v=v253-qx-pdf-folio-fecha'", "old=" + repr(old_version))
          p.write_text(s, encoding='utf-8')
          PY

      - name: Aplicar solamente correccion del PDF
        run: python /tmp/macroxel_v254_pdf_web.py

      - name: Verificar PDF y sintaxis
        shell: bash
        run: |
          grep -q 'function qServicePdfDocumentTitle(data={})' docs/sistema-inventario.js
          grep -q 'v254-pdf-solicitud-servicio-dinamico' docs/index.html
          node --check docs/sistema-inventario.js

      - name: Publicar web v254
        shell: bash
        run: |
          if git diff --quiet -- docs/sistema-inventario.js docs/index.html; then
            echo "v254 ya estaba publicado."
            exit 0
          fi
          git config user.name "Macroxel Web Sync"
          git config user.email "sistemasmacroxel@gmail.com"
          git add docs/sistema-inventario.js docs/index.html tools/v254_pdf_patch_00.txt
          git commit -m "Actualiza web: solicitud PDF y nombre del servicio dinamico v254"
          git push origin HEAD:main
