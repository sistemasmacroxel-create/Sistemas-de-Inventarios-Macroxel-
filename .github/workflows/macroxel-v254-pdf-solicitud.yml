name: Macroxel web PDF solicitud dinamica v254

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macroxel-v254-pdf-solicitud.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web-v254:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar y validar parche v254
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          path = Path('tools/v254_pdf_patch_00.txt')
          encoded = path.read_text().strip()
          for pos in range(-1, len(encoded)):
              candidate = encoded if pos < 0 else encoded[:pos] + encoded[pos+1:]
              try:
                  decoded = gzip.decompress(base64.b64decode(candidate, validate=True))
                  if not decoded.startswith(b'#!/usr/bin/env python3'):
                      continue
                  compile(decoded, '/tmp/macroxel_v254_pdf_web.py', 'exec')
                  Path('/tmp/macroxel_v254_pdf_web.py').write_bytes(decoded)
                  path.write_text(candidate + '\\n')
                  print('Parche PDF v254 recuperado, validado y normalizado.')
                  break
              except (ValueError, OSError, EOFError, SyntaxError):
                  continue
          else:
              raise SystemExit('Parche v254 corrupto, no se modifica la web.')
          PY

      - name: Aplicar solamente correccion del PDF
        run: python /tmp/macroxel_v254_pdf_web.py

      - name: Verificar PDF y sintaxis
        shell: bash
        run: |
          grep -q 'function qServicePdfDocumentTitle(data={})' docs/sistema-inventario.js
          grep -q 'v254-pdf-solicitud-servicio-dinamico' docs/index.html
          node --check docs/sistema-inventario.js

      - name: Publicar web v254
        shell: bash
        run: |
          if git diff --quiet -- docs/sistema-inventario.js docs/index.html; then
            echo "v254 ya estaba publicado."
            exit 0
          fi
          git config user.name "Macroxel Web Sync"
          git config user.email "sistemasmacroxel@gmail.com"
          git add docs/sistema-inventario.js docs/index.html tools/v254_pdf_patch_00.txt
          git commit -m "Actualiza web: solicitud PDF y nombre del servicio dinamico v254"
          git push origin HEAD:main
