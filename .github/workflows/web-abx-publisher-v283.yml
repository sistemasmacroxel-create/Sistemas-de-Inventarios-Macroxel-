name: Sincronizar capacidad de Antibioticos con Control Central v283
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-abx-publisher-v283.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-v283:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener web actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar emisor y validar
        shell: bash
        run: |
          set -eu
          if grep -q 'mx-primary-stock-published' docs/sistema-inventario.js; then
            echo "El publicador ABX ya está integrado, se conserva la versión vigente."
          else
            SHA=$(git hash-object docs/sistema-inventario.js)
            if [ "$SHA" != '9a9812162b96b1d502bfd474b7d1f1fa89b44368' ]; then
              echo "::error::El emisor web ha cambiado, no se sobrescribe."
              exit 1
            fi
            python3 tools/web-abx-publisher-v283.py
          fi
          node --check docs/sistema-inventario.js
          grep -q 'mx-primary-stock-published' docs/sistema-inventario.js
          grep -q 'v283-abx-control-central-20261026' docs/index.html
          git diff --check
      - name: Publicar al sitio web principal
        shell: bash
        run: |
          set -eu
          git config user.name 'Sistemas Macroxel'
          git config user.email 'sistemasmacroxel@gmail.com'
          git add -- docs/sistema-inventario.js docs/index.html
          if git diff --quiet -- docs/sistema-inventario.js docs/index.html; then echo 'Sin cambios, versión ya publicada'; exit 0; fi
          git commit -m 'Sincroniza capacidad antibioticos v283 al publicarse inventario'
          git push origin HEAD:main
